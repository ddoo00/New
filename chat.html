<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>채팅 — 그래픽팀 온보딩 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="gs-body">

<main class="gs-chat-page">
  <div class="gs-chat-notch"></div>
  <div class="gs-chat-toolbar">
    <div class="gs-chat-toolbar-left">
      <a href="index.html" class="gs-home-link" aria-label="홈으로">←</a>
      <span class="gs-chat-toolbar-title">그래픽팀 온보딩봇</span>
    </div>
    <button class="gs-chat-reset" id="resetBtn">새 대화</button>
  </div>
  <div class="gs-chat-messages" id="messages"></div>
  <div class="gs-chat-inputbar">
    <input id="input" type="text" placeholder="예: 내부 컨펌은 어떻게 받아요?" />
    <button id="sendBtn">전송</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const STORAGE_KEY = "onboarding_chatbot_history_v1";
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");

let history = [];
let extraKnowledgeText = ""; // admin.html에서 등록한 지식 (Supabase에서 불러옴)
let isSending = false; // 답변을 기다리는 동안 중복 전송을 막기 위한 잠금 플래그

// 대화가 비어있을 때(첫 진입) 눌러서 바로 물어볼 수 있는 추천 질문
const SUGGESTED_QUESTIONS = [
  "작업 요청부터 컨펌까지 전체 흐름을 알려줘",
  "내부 컨펌은 어떻게 요청해요?",
  "파일이나 에셋은 어떻게 관리해요?",
  "리드타임은 어떻게 안내해요?"
];

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    history = raw ? JSON.parse(raw) : [];
  } catch (e) { history = []; }
}
function saveHistory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderMessages() {
  messagesEl.innerHTML = "";
  if (history.length === 0) {
    addBubble("bot", "안녕하세요! 그래픽팀 온보딩 챗봇이에요. 작업 요청부터 내부 컨펌, 파일 관리까지 궁금한 걸 물어보세요.", false);
    renderSuggestedQuestions();
    return;
  }
  history.forEach(m => {
    const div = document.createElement("div");
    div.className = "gs-msg " + (m.role === "user" ? "gs-msg-user" : "gs-msg-bot");
    div.textContent = m.text;
    messagesEl.appendChild(div);
  });
  scrollToBottom();
}

function renderSuggestedQuestions() {
  const wrap = document.createElement("div");
  wrap.className = "gs-suggest-list";
  wrap.id = "suggestedQuestions";
  SUGGESTED_QUESTIONS.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "gs-suggest-chip";
    btn.type = "button";
    btn.textContent = q;
    btn.addEventListener("click", () => askQuestion(q));
    wrap.appendChild(btn);
  });
  messagesEl.appendChild(wrap);
  scrollToBottom();
}

function addBubble(role, text, persist, citations, followups) {
  const div = document.createElement("div");
  div.className = "gs-msg " + (role === "user" ? "gs-msg-user" : "gs-msg-bot");
  div.textContent = text;
  messagesEl.appendChild(div);
  if (role === "bot" && citations && citations.length) {
    renderCitations(citations);
  }
  if (role === "bot" && followups && followups.length) {
    renderFollowups(followups);
  }
  scrollToBottom();
  if (persist !== false) {
    history.push({ role, text });
    saveHistory();
  }
}

// 답변이 어떤 지식 항목을 근거로 했는지 작은 태그로 보여준다.
function renderCitations(citations) {
  const wrap = document.createElement("div");
  wrap.className = "gs-cite-list";
  const label = document.createElement("span");
  label.className = "gs-cite-label";
  label.textContent = "출처";
  wrap.appendChild(label);
  citations.forEach(title => {
    const chip = document.createElement("span");
    chip.className = "gs-cite-chip";
    chip.textContent = "📄 " + title;
    wrap.appendChild(chip);
  });
  messagesEl.appendChild(wrap);
}

// 답변 뒤에 이어서 물어볼 만한 꼬리 질문을 버튼으로 보여준다.
function renderFollowups(followups) {
  const block = document.createElement("div");
  block.className = "gs-followup-block";
  const label = document.createElement("div");
  label.className = "gs-followup-label";
  label.textContent = "이어서 물어보면 좋아요";
  block.appendChild(label);
  const list = document.createElement("div");
  list.className = "gs-suggest-list";
  followups.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "gs-suggest-chip";
    btn.type = "button";
    btn.textContent = q;
    btn.addEventListener("click", () => askQuestion(q));
    list.appendChild(btn);
  });
  block.appendChild(list);
  messagesEl.appendChild(block);
}

function showTyping() {
  // 혹시 남아있는 이전 타이핑 표시가 있으면 먼저 지운다 (중복 방지 안전장치)
  hideTyping();
  const div = document.createElement("div");
  div.className = "gs-msg gs-msg-typing";
  div.id = "typingIndicator";
  div.textContent = "답변 작성 중...";
  messagesEl.appendChild(div);
  scrollToBottom();
}
function hideTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

async function sendMessage() {
  if (isSending) return; // 이미 답변을 기다리는 중이면 새 전송을 막는다
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  await askQuestion(text);
}

async function askQuestion(text) {
  if (isSending) return; // 추천질문/꼬리질문 버튼 클릭으로 들어와도 동일하게 막는다
  isSending = true;
  sendBtn.disabled = true;
  inputEl.disabled = true;
  const sugg = document.getElementById("suggestedQuestions");
  if (sugg) sugg.remove();
  document.querySelectorAll(".gs-followup-block").forEach(el => el.remove());
  addBubble("user", text);
  showTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        message: text,
        history: history.slice(-10).map(m => ({ role: m.role === "user" ? "user" : "assistant", text: m.text })),
        extraKnowledge: extraKnowledgeText
      })
    });
    hideTyping();
    const data = await res.json();
    if (!res.ok) {
      addBubble("bot", "오류: " + (data.error || "답변을 가져오지 못했어요. 서버 설정(API 키 등)을 확인해 주세요."), false);
      return;
    }
    const answer = (data.answer || "죄송해요, 답변을 만들지 못했어요.").trim();
    addBubble("bot", answer, true, data.citations, data.followups);
    logChatToSupabase(text, answer);
  } catch (err) {
    hideTyping();
    addBubble("bot", "네트워크 오류가 났어요. 잠시 후 다시 시도해 주세요.", false);
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
resetBtn.addEventListener("click", () => { history = []; saveHistory(); renderMessages(); });

loadHistory();
renderMessages();

// admin.html에서 등록한 지식을 불러와 이번 세션 동안 답변에 반영한다.
fetchKnowledgeEntries().then(entries => {
  extraKnowledgeText = formatKnowledgeForPrompt(entries);
});

// index.html / faq.html에서 ?q=질문 형태로 넘어온 경우, 자동으로 그 질문을 물어본다.
(function autoAskFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get("q");
  if (q) {
    inputEl.value = q;
    sendMessage();
    // 주소창에서 쿼리 흔적 제거 (새로고침해도 중복 전송 안 되게)
    window.history.replaceState({}, "", "chat.html");
  }
})();
</script>
</body>
</html>
