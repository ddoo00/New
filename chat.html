<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>채팅 — 그래픽팀 온보딩 챗봇</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="gs-body">

<header class="gs-nav">
  <div class="gs-nav-inner">
    <a href="index.html" class="gs-logo">그래픽팀</a>
    <nav class="gs-nav-links">
      <a href="index.html" class="gs-nav-link">온보딩 페이지</a>
      <a href="faq.html" class="gs-nav-link">자주 묻는 질문</a>
      <a href="chat.html" class="gs-nav-link active">채팅</a>
    </nav>
  </div>
</header>

<main class="gs-chat-page">
  <div class="gs-chat-toolbar">
    <span class="gs-chat-toolbar-title">그래픽팀 온보딩봇</span>
    <button class="gs-chat-reset" id="resetBtn">새 대화</button>
  </div>
  <div class="gs-chat-messages" id="messages"></div>
  <div class="gs-chat-inputbar">
    <input id="input" type="text" placeholder="예: 내부 컨펌은 어떻게 받아요?" />
    <button id="sendBtn">전송</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const STORAGE_KEY = "onboarding_chatbot_history_v1";
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");

let history = [];
let extraKnowledgeText = ""; // admin.html에서 등록한 지식 (Supabase에서 불러옴)

function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    history = raw ? JSON.parse(raw) : [];
  } catch (e) { history = []; }
}
function saveHistory() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderMessages() {
  messagesEl.innerHTML = "";
  if (history.length === 0) {
    addBubble("bot", "안녕하세요! 그래픽팀 온보딩 챗봇이에요. 작업 요청부터 내부 컨펌, 파일 관리까지 궁금한 걸 물어보세요.", false);
    return;
  }
  history.forEach(m => {
    const div = document.createElement("div");
    div.className = "gs-msg " + (m.role === "user" ? "gs-msg-user" : "gs-msg-bot");
    div.textContent = m.text;
    messagesEl.appendChild(div);
  });
  scrollToBottom();
}

function addBubble(role, text, persist) {
  const div = document.createElement("div");
  div.className = "gs-msg " + (role === "user" ? "gs-msg-user" : "gs-msg-bot");
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
  if (persist !== false) {
    history.push({ role, text });
    saveHistory();
  }
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "gs-msg gs-msg-typing";
  div.id = "typingIndicator";
  div.textContent = "답변 작성 중...";
  messagesEl.appendChild(div);
  scrollToBottom();
}
function hideTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = "";
  await askQuestion(text);
}

async function askQuestion(text) {
  sendBtn.disabled = true;
  addBubble("user", text);
  showTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        message: text,
        history: history.slice(-10).map(m => ({ role: m.role === "user" ? "user" : "assistant", text: m.text })),
        extraKnowledge: extraKnowledgeText
      })
    });
    hideTyping();
    const data = await res.json();
    if (!res.ok) {
      addBubble("bot", "오류: " + (data.error || "답변을 가져오지 못했어요. 서버 설정(API 키 등)을 확인해 주세요."), false);
      return;
    }
    const answer = (data.answer || "죄송해요, 답변을 만들지 못했어요.").trim();
    addBubble("bot", answer);
    logChatToSupabase(text, answer);
  } catch (err) {
    hideTyping();
    addBubble("bot", "네트워크 오류가 났어요. 잠시 후 다시 시도해 주세요.", false);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
resetBtn.addEventListener("click", () => { history = []; saveHistory(); renderMessages(); });

loadHistory();
renderMessages();

// admin.html에서 등록한 지식을 불러와 이번 세션 동안 답변에 반영한다.
fetchKnowledgeEntries().then(entries => {
  extraKnowledgeText = formatKnowledgeForPrompt(entries);
});

// index.html / faq.html에서 ?q=질문 형태로 넘어온 경우, 자동으로 그 질문을 물어본다.
(function autoAskFromQuery() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get("q");
  if (q) {
    inputEl.value = q;
    sendMessage();
    // 주소창에서 쿼리 흔적 제거 (새로고침해도 중복 전송 안 되게)
    window.history.replaceState({}, "", "chat.html");
  }
})();
</script>
</body>
</html>
