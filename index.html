<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>그래픽팀 온보딩 챗봇</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="gs-body">

<header class="gs-nav">
  <div class="gs-nav-inner">
    <a href="index.html" class="gs-logo">그래픽팀</a>
    <nav class="gs-nav-links">
      <a href="index.html" class="gs-nav-link active">온보딩 페이지</a>
      <a href="faq.html" class="gs-nav-link">자주 묻는 질문</a>
      <a href="chat.html" class="gs-nav-link">채팅</a>
    </nav>
  </div>
</header>

<main class="gs-hero">
  <h1>궁금한 게 있으면<br />온보딩봇에게 물어보세요</h1>
  <p>
    작업 요청부터 내부 컨펌, 파일·에셋 관리, 리드타임, 구독제 업무까지 —<br class="gs-br-desktop" />
    문서화된 내용만 답하고, 모르는 건 솔직하게 모른다고 말해요.
  </p>
  <div class="gs-hero-actions">
    <a href="chat.html" class="gs-btn gs-btn-dark">채팅 시작하기</a>
    <a href="faq.html" class="gs-btn gs-btn-outline">자주 묻는 질문 보기</a>
  </div>
</main>

<section class="gs-section">
  <div class="gs-section-title">카테고리별로 바로 물어보기</div>
  <div class="gs-cat-grid" id="catGrid"></div>
</section>

<script>
const CATEGORIES = [
  { label: "작업 요청 · 컨펌", desc: "요청부터 컨펌까지 전체 흐름", seed: "작업 요청부터 컨펌까지 전체 흐름을 알려줘" },
  { label: "파일 · 에셋 관리", desc: "파일/에셋 관리 규칙", seed: "파일이나 에셋은 어떻게 관리해요?" },
  { label: "리드타임 안내", desc: "리드타임 산정과 안내", seed: "리드타임은 어떻게 안내해요?" },
  { label: "구독제 업무", desc: "구독제 클라이언트 업무", seed: "구독제 클라이언트 업무는 어떻게 진행해요?" },
  { label: "툴 사용법", desc: "피그마 · 노션 등", seed: "피그마랑 노션은 어떻게 써야 해요?" },
  { label: "일정 · 보고", desc: "일정 관리와 보고 방식", seed: "일정 관리랑 보고는 어떻게 해요?" }
];

const catGrid = document.getElementById("catGrid");
catGrid.innerHTML = CATEGORIES.map(c =>
  `<a class="gs-cat-card" href="chat.html?q=${encodeURIComponent(c.seed)}">${c.label}<span>${c.desc}</span></a>`
).join("");
</script>
</body>
</html>
